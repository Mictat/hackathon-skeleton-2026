<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Cairn{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>

<body class="min-h-screen bg-base-200">
    <div class="navbar bg-base-100 shadow mb-6">
        <div class="flex-1 px-4">
            <a href="/" class="text-xl font-bold">⛰️ Cairn</a>
            <span class="ml-2 text-sm opacity-60 hidden md:inline">AI Data Discovery &amp; Governance</span>
        </div>
        <div class="flex-none gap-2 px-4 items-center">
            <a href="/catalog" class="btn btn-ghost btn-sm">Catalog</a>
            <a href="/review" class="btn btn-ghost btn-sm">Review
                <span id="navbar-review-badge" class="badge badge-error badge-sm">{{ review_count }}</span>
            </a>
            <a href="/audit" class="btn btn-ghost btn-sm">Audit</a>
            <form method="post" action="/pages/user" class="flex items-center gap-2">
                <span class="text-xs opacity-60 hidden md:inline">acting as</span>
                <select name="user_id" class="select select-bordered select-sm" onchange="this.form.submit()">
                    {% for u in users %}
                    <option value="{{ u.id }}" {% if u.id==user.id %}selected{% endif %}>
                        {{ u.name }} · {{ u.role.value }}</option>
                    {% endfor %}
                </select>
            </form>
        </div>
    </div>
    <div class="container mx-auto p-6 pt-0">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
